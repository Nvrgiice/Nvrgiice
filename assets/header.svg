<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Nargice - Cybersecurity Engineering Student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14101f"/>
      <stop offset="1" stop-color="#0b0b14"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FF9AC1"/>
      <stop offset="0.5" stop-color="#FF2E93"/>
      <stop offset="1" stop-color="#A855F7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.6 0" to="0.6 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D94"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4D94" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4D94" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF4D94" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FF2E93" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF2E93" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clipCard"><rect x="2" y="2" width="896" height="276" rx="18"/></clipPath>
    <clipPath id="type"><rect x="40" y="40" width="0" height="34"><animate attributeName="width" from="0" to="200" dur="1.2s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Card -->
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
  <g clip-path="url(#clipCard)">
    <rect width="900" height="280" fill="url(#glow1)"/>
    <rect width="900" height="280" fill="url(#glow2)"/>

    <!-- Subtle grid -->
    <g stroke="#FF4D94" stroke-opacity="0.07" stroke-width="1">
      <path d="M0 40H900M0 80H900M0 120H900M0 160H900M0 200H900M0 240H900"/>
      <path d="M60 0V280M120 0V280M180 0V280M240 0V280M300 0V280M360 0V280M420 0V280M480 0V280M540 0V280M600 0V280M660 0V280M720 0V280M780 0V280M840 0V280"/>
    </g>

    <!-- Scan band -->
    <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
      <animate attributeName="y" from="-60" to="280" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Floating bits -->
    <g class="mono" font-size="14" fill="#FF4D94" fill-opacity="0.35">
      <text x="760" y="60">0x4E41</text>
      <text x="820" y="120">101101</text>
      <text x="730" y="200">sudo</text>
      <text x="800" y="250">nmap -sV</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="6s" repeatCount="indefinite"/>
    </g>
    <g class="mono" font-size="13" fill="#A855F7" fill-opacity="0.35">
      <text x="640" y="40">XSS</text>
      <text x="690" y="95">SQLi</text>
      <text x="650" y="230">OWASP</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Terminal prompt -->
  <g clip-path="url(#type)">
    <text x="40" y="66" class="mono" font-size="22" fill="#FF9AC1">$ whoami</text>
  </g>
  <rect x="236" y="48" width="12" height="22" fill="#FF4D94">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Name -->
  <text x="40" y="155" class="sans" font-size="84" font-weight="800" fill="url(#name)" letter-spacing="2">Nargice</text>

  <!-- Subtitle -->
  <text x="42" y="196" class="sans" font-size="26" font-weight="600" fill="#F3E8FF">Cybersecurity Engineering Student</text>

  <!-- Rotating tagline -->
  <g class="mono" font-size="18" fill="#FF9AC1">
    <text x="42" y="238" opacity="0">&gt; Keep learning. Keep growing. Become an expert.
      <animate attributeName="opacity" values="0;1;1;0;0;0" keyTimes="0;0.06;0.30;0.36;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="238" opacity="0">&gt; Web security · OWASP · CTF · Azure
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.40;0.63;0.69;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="238" opacity="0">&gt; Seeking a work-study · IDF · Rennes · Nantes
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.73;0.96;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
